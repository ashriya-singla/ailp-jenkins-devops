[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ailp"
version = "1.0.0"
description = "AI Learning Passport evidence and consent service"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3", "gunicorn==26.2.0"]

[tool.setuptools.package-data]
ailp = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".venv", "runtime", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
