<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AILP — SIT223 Task 7.2D Prototype</title>
<style>
:root{--ink:#242424;--muted:#666;--line:#b9b9b9;--paper:#fff;--wash:#f3f3f3}*{box-sizing:border-box}body{margin:0;background:#e8e8e8;color:var(--ink);font:15px Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #555;background:white;padding:10px 16px;border-radius:3px}button:hover{background:#e7e7e7}button.primary{background:#303030;color:white}button.primary:hover{background:#555}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #777;outline-offset:3px}.shell{max-width:1320px;margin:28px auto;background:white;border:1px solid #999;min-height:850px;box-shadow:5px 5px 0 #d2d2d2}header{padding:22px 28px;border-bottom:2px solid #555;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:25px;font-weight:bold;letter-spacing:2px}.brand small{display:block;font-size:12px;font-weight:normal;letter-spacing:0;margin-top:7px;color:#666}.prototype{border:1px dashed #777;padding:7px 12px;font-size:12px}.layout{display:grid;grid-template-columns:235px 1fr}nav{background:#f7f7f7;border-right:1px solid var(--line);padding:24px 14px}nav p{font-size:11px;letter-spacing:1.5px;padding:0 12px;color:#666}nav button{display:block;width:100%;text-align:left;margin:7px 0;border:1px solid transparent;background:transparent;padding:12px 10px;font-size:14px}nav button.active{border:1px solid #555;background:#ddd;font-weight:bold}.num{display:inline-block;width:23px;font-size:12px;color:#666}main{padding:30px 34px;min-width:0}h1{font-size:27px;margin:7px 0 10px}h2{font-size:18px;margin:0 0 18px}h3{font-size:15px;margin:0 0 10px}p{line-height:1.55}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#666;text-transform:uppercase}.sub{color:#666;margin:0 0 25px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.card{border:1px solid var(--line);padding:20px;background:white;margin-bottom:20px}.stat{font-size:32px;font-weight:bold;margin:12px 0}.muted{color:#666;font-size:13px}.notice{border:1px dashed #888;padding:14px 16px;background:#f7f7f7;line-height:1.5;margin:18px 0}.tag{display:inline-block;border:1px solid #888;background:#f1f1f1;padding:4px 8px;font-size:11px;letter-spacing:.3px}.entry{border:1px solid #aaa;border-left:5px solid #888;padding:18px;margin:14px 0}.entry p{margin:10px 0}.entry .actions{margin:12px 0 0}label.field{display:block;font-weight:bold;margin:18px 0 8px}input[type=text],textarea,select{width:100%;border:1px solid #999;background:#fafafa;padding:11px;border-radius:2px}textarea{min-height:112px;resize:vertical;line-height:1.5}.check{display:flex;align-items:flex-start;gap:10px;line-height:1.5;margin:16px 0}.check input{margin-top:4px;accent-color:#333}.choice{display:flex;gap:10px}.choice button[aria-pressed=true]{background:#333;color:white}.placeholder{border:1px dashed #999;background:repeating-linear-gradient(135deg,#fafafa,#fafafa 8px,#f2f2f2 8px,#f2f2f2 9px);padding:28px;text-align:center;color:#666}.steps{display:flex;gap:12px;margin:22px 0;color:#666;font-size:13px}.steps span{border-bottom:2px solid #bbb;padding-bottom:9px;flex:1}.steps span:first-child{border-color:#333;color:#333}footer{border-top:1px solid #bbb;padding:15px 28px;font-size:12px;color:#666;display:flex;justify-content:space-between;gap:15px}dialog{max-width:650px;width:90%;padding:28px;border:2px solid #555}dialog::backdrop{background:#0006}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:14px 22px;max-width:90%;z-index:10;display:none}.empty{text-align:center;padding:30px;color:#666}.progress{height:9px;background:#ddd;margin:15px 0}.progress div{height:100%;background:#777}a{color:#222}.passport{border:2px solid #777;padding:24px}hr{border:0;border-top:1px solid #ccc;margin:20px 0}@media(max-width:900px){.shell{margin:0}.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid #aaa;display:flex;flex-wrap:wrap;padding:10px}nav p{display:none}nav button{width:auto;font-size:12px;margin:3px;padding:8px}.two,.grid{grid-template-columns:1fr}main{padding:22px}header{padding:18px}.prototype{display:none}}@media print{nav,header,footer,.actions,.notice,#toast{display:none!important}.shell{border:0;box-shadow:none;margin:0}.layout{display:block}main{padding:0}.card,.entry{break-inside:avoid}}
</style>
</head>
<body>
<div class="shell"><header><div class="brand">AILP <small>AI Learning Passport · InnovAIte / AAIE extension</small></div><div class="prototype">SIT223 · TASK 7.2D · LOW-FIDELITY PROTOTYPE</div><span class="tag" id="role">STUDENT VIEW</span></header><div class="layout"><nav aria-label="Prototype screens" id="nav"></nav><main id="main"></main></div><footer><span>Permitted AI use → human decisions → learning reflection</span><span>Demonstration only · No automatic misconduct or integrity score</span></footer></div>
<dialog id="source"><div class="row"><h2>Linked source evidence</h2><button onclick="document.getElementById('source').close()" aria-label="Close source">Close ×</button></div><div id="sourceBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const screens=['Student Dashboard','Import AI Evidence','Evidence Timeline','Add Decision Note','Learning Passport Preview','Educator Evidence View','Privacy & Controls'];
const seed=[{id:1,title:'Exploring accessible navigation',tool:'Permitted AI tool',date:'02 Oct 2026 · 10:15',prompt:'Suggest accessible navigation patterns for a student learning dashboard.',response:'Use descriptive navigation labels, visible keyboard focus, consistent page structure and clear feedback after actions.',decision:'Modified',reason:'I kept descriptive labels and keyboard focus, but simplified the menu to fit our seven-screen prototype.',reflection:'I learned to compare AI suggestions with the task requirements and accessibility needs.',link:'Sample interaction AILP-001'},{id:2,title:'Comparing evidence timeline layouts',tool:'Permitted AI tool',date:'02 Oct 2026 · 11:40',prompt:'How could an evidence timeline help students explain their use of AI?',response:'Group interactions chronologically and link each interaction to a decision and reflection.',decision:'Accepted',reason:'A chronological layout makes my process easier to follow and keeps each decision linked to its source.',reflection:'A useful record explains how my thinking changed, not just which tool I used.',link:'Sample interaction AILP-002'},{id:3,title:'Considering an automated integrity score',tool:'Permitted AI tool',date:'03 Oct 2026 · 09:20',prompt:'Suggest a summary feature for educator review.',response:'Generate an integrity score from patterns of AI use.',decision:'Rejected',reason:'An automatic score could misrepresent learning and unfairly imply misconduct. Educators should review contextual evidence.',reflection:'I need to question AI recommendations and preserve human judgement.',link:'Sample interaction AILP-003'}];
let evidence=seed.map(x=>({...x})),page=0,selected=1,choice='Modified',consent=false,share=false,hidePrompts=false,filter='All',feedback={},importDraft={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>evidence.find(e=>e.id===Number(id));
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',3500)}
function go(n,id){page=n;if(id)selected=Number(id);if(n===3)choice=byId(selected)?.decision||'Accepted';render();window.scrollTo(0,0)}
function btn(s,n,primary=false){return `<button class="${primary?'primary':''}" onclick="go(${n})">${s}</button>`}
function intro(n,sub){return `<div class="eyebrow">Screen ${n+1} of 7 · ${n===5?'Educator workspace':'Student workspace'}</div><h1>${screens[n]}</h1><p class="sub">${sub}</p>`}
function source(id){const e=byId(id);if(!e)return;document.getElementById('sourceBody').innerHTML=`<p class="muted">${esc(e.link)} · ${esc(e.tool)} · ${esc(e.date)}</p><h3>Student prompt</h3><div class="notice">${esc(e.prompt)}</div><h3>AI response</h3><div class="notice">${esc(e.response)}</div><p class="muted">Prototype source record. These are illustrative interactions, not recovered transcripts.</p>`;document.getElementById('source').showModal()}
function entry(e,educator=false){return `<article class="entry"><div class="row"><h3>${esc(e.title)}</h3><span class="tag">${esc(e.decision||'Needs decision')}</span></div><div class="muted">${esc(e.tool)} · ${esc(e.date)} · Evidence #${e.id}</div><p><strong>Reasoning:</strong> ${esc(e.reason||'Add a decision note to explain your judgement.')}</p>${educator?`<p><strong>Reflection:</strong> ${esc(e.reflection||'Not yet recorded.')}</p>`:''}<div class="actions">${hidePrompts&&educator?'<span class="muted">Source text withheld by student privacy controls.</span>':`<button onclick="source(${e.id})">View linked source</button>`}${educator?`<button onclick="review(${e.id})">Add review comment</button>`:`<button onclick="go(3,${e.id})">${e.reason?'Edit':'Add'} decision note</button>`}</div>${educator&&feedback[e.id]?`<div class="notice"><strong>Educator comment:</strong> ${esc(feedback[e.id])}</div>`:''}</article>`}
function render(){document.getElementById('nav').innerHTML='<p>PROTOTYPE SCREENS</p>'+screens.map((s,i)=>`<button class="${page===i?'active':''}" ${page===i?'aria-current="page"':''} onclick="go(${i})"><span class="num">0${i+1}</span>${s}</button>`).join('');document.getElementById('role').textContent=page===5?'EDUCATOR VIEW':'STUDENT VIEW';let html='';
if(page===0){const complete=evidence.filter(e=>e.reason).length;html=intro(0,'Document how you used permitted AI and how you made your own learning decisions.')+`<div class="row"><p><strong>Alex Student</strong> · SIT223 · Task 7.2D</p><span class="tag">DRAFT PASSPORT</span></div><div class="grid"><div class="card"><h3>AI evidence records</h3><div class="stat">${evidence.length}</div><span class="muted">Source-linked interactions</span></div><div class="card"><h3>Decision notes</h3><div class="stat">${complete}/${evidence.length}</div><span class="muted">Accepted · Modified · Rejected</span></div><div class="card"><h3>Educator access</h3><div class="stat" style="font-size:24px">${share?'Shared':'Private'}</div><span class="muted">Controlled by your consent</span></div></div><div class="two"><div class="card"><h2>Your learning record</h2><p>Import permitted AI interactions, explain what you accepted, modified or rejected, and reflect on what you learned.</p><div class="progress"><div style="width:${evidence.length?complete/evidence.length*100:0}%"></div></div><span class="muted">${complete} evidence records have decision notes</span><div class="actions">${btn('Import AI evidence',1,true)}${btn('View timeline',2)}</div></div><div class="card"><h2>Passport checklist</h2><p>□ Check permitted AI use<br>□ Link source evidence<br>□ Explain decisions<br>□ Review before sharing</p>${btn('Preview passport',4)}</div></div><div class="notice">Your passport supports reflection and contextual educator review. It does not produce an automatic misconduct or integrity score.</div>`}
if(page===1)html=intro(1,'Select only AI interactions permitted for this assessment. Review the content before adding it.')+`<div class="steps"><span>1 · Select evidence</span><span>2 · Confirm consent</span><span>3 · Add decision note</span></div><div class="two"><form id="importForm" class="card" onsubmit="importEvidence(event)"><h2>Import an interaction</h2><label class="field" for="tool">AI tool</label><select id="tool"><option>Permitted AI tool</option><option>Microsoft Copilot</option><option>Other permitted AI tool</option></select><label class="field" for="title">Evidence title</label><input id="title" type="text" required placeholder="e.g. Exploring accessible navigation"><label class="field" for="prompt">Your prompt</label><textarea id="prompt" required placeholder="Paste the prompt you sent to the AI tool"></textarea><label class="field" for="response">AI response</label><textarea id="response" required placeholder="Paste the relevant AI response"></textarea><label class="check"><input id="importConsent" type="checkbox" required><span>I confirm this interaction was permitted for this assessment and consent to adding this selected evidence to my passport.</span></label><div class="actions"><button type="submit" class="primary">Import evidence</button><button type="button" onclick="fillSample()">Use sample evidence</button></div></form><aside><div class="card"><h2>Selective import</h2><div class="placeholder">[ AI interaction excerpt ]<br><br>Prompt → Response → Your decision</div><p>Paste one relevant interaction at a time. Remove personal or sensitive information before importing.</p></div><div class="notice">This offline prototype does not connect to an AI account or upload data. Imports remain in this browser tab until you reload or delete them.</div></aside></div>`;
if(page===2)html=intro(2,'Follow your AI interactions and the decisions that shaped your work.')+`<div class="row"><label>Decision filter <select style="width:auto;margin-left:8px" onchange="filter=this.value;render()">${['All','Accepted','Modified','Rejected','Needs decision'].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select></label>${btn('+ Import evidence',1,true)}</div>`+(evidence.filter(e=>filter==='All'||(e.decision||'Needs decision')===filter).map(e=>entry(e)).join('')||'<div class="empty">No evidence matches this filter.</div>')+`<div class="actions">${btn('Back to dashboard',0)}${btn('Preview learning passport →',4,true)}</div>`;
if(page===3){const e=byId(selected)||evidence[0];if(!e){html=intro(3,'Import an interaction before adding a decision note.')+btn('Import evidence',1,true)}else{selected=e.id;html=intro(3,'Explain your judgement and what you learned from this AI interaction.')+`<div class="two"><form class="card" onsubmit="saveNote(event)"><label class="field" for="record">Linked evidence</label><select id="record" onchange="go(3,this.value)">${evidence.map(x=>`<option value="${x.id}" ${x.id===e.id?'selected':''}>#${x.id} · ${esc(x.title)}</option>`).join('')}</select><label class="field">Your decision</label><div class="choice">${['Accepted','Modified','Rejected'].map(s=>`<button type="button" aria-pressed="${choice===s}" onclick="setChoice('${s}')">${s}</button>`).join('')}</div><label class="field" for="reason">Reasoning / changes made</label><textarea id="reason" required placeholder="Why did you make this decision? What did you change or verify?">${esc(e.reason)}</textarea><label class="field" for="reflection">Learning reflection</label><textarea id="reflection" required placeholder="What did you learn, and how did your thinking develop?">${esc(e.reflection)}</textarea><div class="actions"><button class="primary" type="submit">Save decision note</button><button type="button" onclick="go(2)">Cancel</button></div></form><aside class="card"><h2>Source context</h2><p><strong>${esc(e.title)}</strong></p><span class="muted">${esc(e.tool)} · ${esc(e.date)}</span><div class="notice">${esc(e.prompt)}</div><button onclick="source(${e.id})">View full linked source</button><hr><h3>Reflection prompts</h3><p>What was useful?<br>What needed checking?<br>How did you apply your own judgement?<br>What will you do differently next time?</p></aside></div>`}}
if(page===4)html=intro(4,'Review your selected evidence and learning narrative before sharing with an educator.')+`<div class="passport"><div class="row"><h2>AI Learning Passport</h2><span class="tag">${share?'SHARED WITH EDUCATOR':'PRIVATE DRAFT'}</span></div><p><strong>Alex Student</strong> · SIT223 · Task 7.2D</p><div class="notice">Declaration: This passport records selected permitted AI interactions and my own decisions, reasoning and reflection. AI output is identified as source material.</div><h3>Decision summary</h3><p>${['Accepted','Modified','Rejected'].map(s=>`${s}: ${evidence.filter(e=>e.decision===s).length}`).join(' &nbsp; | &nbsp; ')}</p><h3>Evidence and learning narrative</h3>${evidence.map(e=>`<div class="entry"><div class="row"><h3>${esc(e.title)}</h3><span class="tag">${esc(e.decision||'Needs decision')}</span></div><p><strong>Reasoning:</strong> ${esc(e.reason||'Not yet recorded.')}</p><p><strong>Reflection:</strong> ${esc(e.reflection||'Not yet recorded.')}</p><button onclick="source(${e.id})">Source #${e.id}</button></div>`).join('')||'<p>No evidence has been added.</p>'}<p class="muted">Educator interpretation requires context and human judgement. No automated integrity score is generated.</p></div><div class="actions">${btn('Edit evidence',2)}<button onclick="window.print()">Print / Save as PDF</button>${btn(share?'Open educator evidence view':'Set sharing consent →',share?5:6,true)}</div>`;
if(page===5)html=intro(5,'Review student decisions alongside their linked sources. Use context and human judgement.')+(share?`<div class="card"><div class="row"><h2>Alex Student · SIT223</h2><span class="tag">CONSENT GRANTED</span></div><p>Task 7.2D · ${evidence.length} selected evidence records · Student-controlled sharing</p><div class="notice">This is a demonstration educator view. Assess learning and reasoning in context; the passport does not infer misconduct or assign an integrity score.</div></div>${evidence.map(e=>entry(e,true)).join('')||'<div class="empty">No evidence shared.</div>'}<div class="actions">${btn('Return to passport',4)}${btn('Privacy & controls',6)}</div>`:`<div class="card"><h2>Educator access is closed</h2><div class="placeholder">[ Private learning passport ]</div><p>The student must explicitly consent before this view displays evidence. Sharing can be withdrawn at any time.</p>${btn('Open privacy & controls',6,true)}</div>`);
if(page===6)html=intro(6,'Choose what is recorded and shared. Your learning evidence remains under your control.')+`<div class="two"><div class="card"><h2>Consent & sharing</h2><label class="check"><input type="checkbox" id="consent" ${consent?'checked':''} onchange="consent=this.checked;if(!consent)share=false;render()"><span><strong>I consent to educator review</strong><br><span class="muted">Allow this demonstration educator to review the selected evidence, decision notes and reflections in my passport.</span></span></label><label class="check"><input type="checkbox" ${share?'checked':''} ${!consent?'disabled':''} onchange="share=this.checked;render();toast(share?'Passport sharing enabled.':'Educator access withdrawn.')"><span><strong>Share passport with educator</strong><br><span class="muted">${share?'Educator access is currently enabled.':'Passport is currently private.'}</span></span></label><label class="check"><input type="checkbox" ${hidePrompts?'checked':''} onchange="hidePrompts=this.checked;render()"><span><strong>Withhold source text in educator view</strong><br><span class="muted">Share decision notes and reflections only. Linked prompt and response text will be unavailable to the educator.</span></span></label><div class="actions">${btn('Preview passport',4,true)}${btn('Check educator view',5)}<button onclick="withdraw()">Withdraw consent</button></div></div><aside><div class="card"><h2>Data controls</h2><p>All demonstration data is held in memory in this tab. Reloading restores the original sample records and turns sharing off.</p><button onclick="exportData()">Download my evidence (.json)</button><div class="actions"><button onclick="confirmDelete()">Delete all evidence</button></div></div><div class="notice"><strong>Transparent review</strong><br>No background monitoring, account access, automatic misconduct prediction or integrity score. This prototype makes no network requests.</div></aside></div>`;
document.getElementById('main').innerHTML=html}
function fillSample(){document.getElementById('title').value='Evaluating feedback on a wireframe';document.getElementById('prompt').value='Suggest ways to make a decision-note form easier to understand.';document.getElementById('response').value='Separate the decision from the reasoning and learning reflection. Use clear labels and link the original AI interaction.';toast('Sample pasted. Review it and confirm permitted use before importing.')}
function importEvidence(ev){ev.preventDefault();if(!document.getElementById('importConsent').checked)return;const id=Math.max(0,...evidence.map(e=>e.id))+1;evidence.push({id,title:document.getElementById('title').value.trim(),tool:document.getElementById('tool').value,prompt:document.getElementById('prompt').value.trim(),response:document.getElementById('response').value.trim(),date:'Imported in this session',decision:'',reason:'',reflection:'',link:'Locally pasted interaction AILP-'+String(id).padStart(3,'0')});go(2);toast('Evidence imported. Add a decision note to explain your judgement.')}
function setChoice(s){choice=s;document.querySelectorAll('.choice button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===s))}
function saveNote(ev){ev.preventDefault();const e=byId(selected);e.decision=choice;e.reason=document.getElementById('reason').value.trim();e.reflection=document.getElementById('reflection').value.trim();if(!e.reason||!e.reflection){toast('Please add reasoning and a learning reflection.');return}go(2);toast('Decision note saved and linked to its source.')}
function withdraw(){consent=false;share=false;render();toast('Consent withdrawn. Educator access is closed.')}
function confirmDelete(){document.getElementById('sourceBody').innerHTML='<p>Delete all evidence, decision notes and review comments from this session?</p><p class="muted">You can reload the file to restore the demonstration sample.</p><div class="actions"><button class="primary" onclick="evidence=[];feedback={};share=false;consent=false;document.getElementById(\'source\').close();render();toast(\'All session evidence deleted.\')">Delete evidence</button><button onclick="document.getElementById(\'source\').close()">Cancel</button></div>';document.querySelector('#source h2').textContent='Delete session evidence';document.getElementById('source').showModal()}
function review(id){document.querySelector('#source h2').textContent='Educator review comment';document.getElementById('sourceBody').innerHTML=`<p>Evidence #${id} · ${esc(byId(id).title)}</p><form onsubmit="saveReview(event,${id})"><label class="field" for="reviewText">Contextual feedback</label><textarea id="reviewText" required placeholder="Discuss the student's reasoning and learning, referencing the evidence.">${esc(feedback[id]||'')}</textarea><div class="actions"><button class="primary" type="submit">Save comment</button></div></form>`;document.getElementById('source').showModal()}
function saveReview(ev,id){ev.preventDefault();feedback[id]=document.getElementById('reviewText').value.trim();document.getElementById('source').close();render();toast('Educator comment saved for this demonstration session.')}
function exportData(){const blob=new Blob([JSON.stringify({project:'AILP SIT223 Task 7.2D',demonstration:true,evidence,consent,shared:share,withholdSourceText:hidePrompts,educatorComments:feedback},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AILP-session-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const originalSource=source;source=function(id){document.querySelector('#source h2').textContent='Linked source evidence';originalSource(id)};
render();
</script>
</body></html>
